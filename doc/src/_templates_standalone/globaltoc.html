{#- The manual's chapters, in a menu under "User Manual" in the top bar.
    Avoid the "globaltoc" class: the theme's script rewrites such lists. #}
<div class="site-chapters">
  <button class="site-chapters-toggle{% if in_manual and pagename != 'faq' %} site-current{% endif %}" type="button" aria-expanded="false" aria-controls="site-chapters-menu">{{ _('User Manual') }}<i class="fa-solid fa-angle-down" aria-hidden="true"></i></button>
  <div class="site-chapters-menu" id="site-chapters-menu">
    <a class="site-chapters-all" href="{{ pathto(master_doc) }}">{{ _('Contents') }}</a>
    {{ toctree(maxdepth=theme_globaltoc_depth|toint, collapse=False, includehidden=theme_globaltoc_includehidden|tobool) }}
  </div>
</div>
