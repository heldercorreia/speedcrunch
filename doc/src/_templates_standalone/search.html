{#- The search page, based on the Bootstrap theme's search.html. The warning
    for visitors without JavaScript is in <noscript>: the theme hid it with
    jQuery's global $, which jquery-fix.js removes, so it stayed on screen.
    The theme's server-side results (Sphinx websupport) are left out. #}
{%- extends "layout.html" %}
{% set title = _('Search') %}
{% block extrahead %}
  <script type="text/javascript" src="{{ pathto('_static/searchtools.js', 1) }}"></script>
  <script type="text/javascript" src="{{ pathto('_static/language_data.js', 1) }}"></script>
  <script type="text/javascript" src="{{ pathto('searchindex.js', 1) }}"></script>
  {# this is used when loading the search index using $.ajax fails,
     such as on Chrome for documents on localhost #}
  <script type="text/javascript" id="searchindexloader"></script>
  {{ super() }}
{% endblock %}
{% block body %}
  <h1 id="search-documentation">{{ _('Search') }}</h1>
  <noscript>
  <div class="admonition warning">
  <p>
    {% trans %}Please activate JavaScript to enable the search
    functionality.{% endtrans %}
  </p>
  </div>
  </noscript>
  <p>
    {% trans %}From here you can search these documents. Enter your search
    words into the box below and click "search". Note that the search
    function will automatically search for all of the words. Pages
    containing fewer words won't appear in the result list.{% endtrans %}
  </p>

  {% if theme_bootstrap_version == "3" %}
  <form class="form-inline" action="" method="get">
    <div class="form-group">
      <input type="text" class="form-control" name="q" value="" />
    </div>
    <input type="submit" class="btn btn-default" value="{{ _('search') }}" />
    <span id="search-progress" style="padding-left: 10px"></span>
  </form>
  {% else %}
  <form class="form-search">
    <input type="text" class="input-medium search-query" name="q" value="" />
    <input type="submit" class="btn btn-default" value="{{ _('search') }}" />
    <span id="search-progress" style="padding-left: 10px"></span>
  </form>
  {% endif %}

  <div id="search-results"></div>
{% endblock %}
