{#- Links to the previous and next pages of the manual, at the end of the
    breadcrumb row (see layout.html). #}
{%- if prev or next %}
<li class="breadcrumb-rel">
  {%- if prev %}
  <a href="{{ prev.link|e }}" rel="prev" title="{{ (_('Previous Page: ') ~ prev.title|striptags)|e }}"><i class="fa-solid fa-angle-left" aria-hidden="true"></i> {{ _('Previous') }}</a>
  {%- endif %}
  {%- if next %}
  <a href="{{ next.link|e }}" rel="next" title="{{ (_('Next Page: ') ~ next.title|striptags)|e }}">{{ _('Next') }} <i class="fa-solid fa-angle-right" aria-hidden="true"></i></a>
  {%- endif %}
</li>
{%- endif %}
