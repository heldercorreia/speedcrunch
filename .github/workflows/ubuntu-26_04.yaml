name: Ubuntu 26.04 LTS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev openbox pkg-config qt6-base-dev qt6-l10n-tools \
            qt6-tools-dev qt6-tools-dev-tools xauth xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a sh -c '
            openbox >/dev/null 2>&1 &
            ctest --test-dir build --output-on-failure --test-output-size-failed 0 \
              --output-junit "$GITHUB_WORKSPACE/test-results.xml"
          '

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            test-results.xml
          if-no-files-found: ignore
