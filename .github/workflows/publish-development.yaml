name: Publish Development Build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit SHA from main (leave empty for the current main commit)'
        required: false
        type: string
      publish:
        description: 'Publish development build after validating all four packages'
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - name: Select successful runs from one commit
        id: select
        uses: actions/github-script@v8
        env:
          TARGET_COMMIT: ${{ inputs.commit || github.sha }}
        with:
          script: |
            const fs = require('node:fs');
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Run this workflow from the main branch.');
            }
            const sha = process.env.TARGET_COMMIT.trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Supply a full 40-character commit SHA.');
            }
            const repo = context.repo;
            const comparison = await github.request(
              'GET /repos/{owner}/{repo}/compare/{basehead}',
              {...repo, basehead: sha + '...main'});
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('The selected commit is not on main.');
            }
            const formats = {
              'windows-installer': ['windows-x64\\.exe', 'windows-x64.exe'],
              'windows-portable': ['windows-x64\\.zip', 'windows-x64.zip'],
              'macos-installer': ['macos-arm64\\.dmg', 'macos-arm64.dmg'],
              'macos-portable': ['macos-arm64\\.zip', 'macos-arm64.zip']
            };
            const selection = {sha, runs: [], packages: []};
            for (const key of ['windows-debug', 'macos-debug', ...Object.keys(formats)]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...repo, workflow_id: key + '.yaml', branch: 'main',
                head_sha: sha, per_page: 100
              });
              const run = runs.filter(item => item.head_sha === sha
                && item.head_branch === 'main'
                && ['push', 'workflow_dispatch'].includes(item.event))
                .sort((a, b) => b.id - a.id)[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(key + ' needs a successful latest run for ' + sha);
              }
              if (run.head_repository.full_name !== repo.owner + '/' + repo.repo) {
                throw new Error('Unexpected source repository for ' + key);
              }
              selection.runs.push({key, id: run.id, url: run.html_url});
              if (!formats[key]) continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {...repo, run_id: run.id, per_page: 100});
              const pattern = new RegExp('^SpeedCrunch-([0-9]+(?:\\.[0-9]+)*)-'
                + formats[key][0] + '$');
              const packages = artifacts.filter(item => !item.expired && pattern.test(item.name));
              const metadata = artifacts.filter(item => !item.expired
                && item.name === key + '-metadata');
              if (packages.length !== 1 || metadata.length !== 1) {
                throw new Error('Expected one package and one metadata artifact for ' + key);
              }
              const packageArtifact = packages[0];
              selection.packages.push({
                key, name: packageArtifact.name, version: packageArtifact.name.match(pattern)[1],
                asset: 'SpeedCrunch-development-' + formats[key][1]
              });
              core.setOutput(key + '-run', String(run.id));
              core.setOutput(key + '-package', String(packageArtifact.id));
              core.setOutput(key + '-metadata', String(metadata[0].id));
            }
            if (new Set(selection.packages.map(item => item.version)).size !== 1) {
              throw new Error('The four packages have different application versions.');
            }
            fs.writeFileSync('selection.json', JSON.stringify(selection, null, 2) + '\n');
            core.setOutput('sha', sha);

      - name: Download windows-installer package
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.windows-installer-run }}
          artifact-ids: ${{ steps.select.outputs.windows-installer-package }}
          path: downloads/windows-installer
          skip-decompress: true
          digest-mismatch: error

      - name: Download windows-installer metadata
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.windows-installer-run }}
          artifact-ids: ${{ steps.select.outputs.windows-installer-metadata }}
          path: downloads/windows-installer-metadata
          digest-mismatch: error

      - name: Download windows-portable package
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.windows-portable-run }}
          artifact-ids: ${{ steps.select.outputs.windows-portable-package }}
          path: downloads/windows-portable
          skip-decompress: true
          digest-mismatch: error

      - name: Download windows-portable metadata
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.windows-portable-run }}
          artifact-ids: ${{ steps.select.outputs.windows-portable-metadata }}
          path: downloads/windows-portable-metadata
          digest-mismatch: error

      - name: Download macos-installer package
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.macos-installer-run }}
          artifact-ids: ${{ steps.select.outputs.macos-installer-package }}
          path: downloads/macos-installer
          skip-decompress: true
          digest-mismatch: error

      - name: Download macos-installer metadata
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.macos-installer-run }}
          artifact-ids: ${{ steps.select.outputs.macos-installer-metadata }}
          path: downloads/macos-installer-metadata
          digest-mismatch: error

      - name: Download macos-portable package
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.macos-portable-run }}
          artifact-ids: ${{ steps.select.outputs.macos-portable-package }}
          path: downloads/macos-portable
          skip-decompress: true
          digest-mismatch: error

      - name: Download macos-portable metadata
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.macos-portable-run }}
          artifact-ids: ${{ steps.select.outputs.macos-portable-metadata }}
          path: downloads/macos-portable-metadata
          digest-mismatch: error

      - name: Verify package contents and checksums
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const selection = JSON.parse(fs.readFileSync('selection.json', 'utf8'));
            const checksums = [];
            fs.mkdirSync('candidate', {recursive: true});
            for (const item of selection.packages) {
              const directory = path.join('downloads', item.key);
              const metadata = path.join('downloads', item.key + '-metadata');
              const revision = fs.readFileSync(path.join(metadata, 'source-revision.txt'), 'utf8').trim();
              if (revision !== selection.sha) {
                throw new Error('Wrong source revision in ' + item.key);
              }
              const files = fs.readdirSync(directory);
              if (files.length !== 1 || files[0] !== item.name) {
                throw new Error('Unexpected package files in ' + item.key);
              }
              const file = path.join(directory, item.name);
              const bytes = fs.readFileSync(file);
              if (!bytes.length) throw new Error('Empty package: ' + item.name);
              const line = fs.readFileSync(path.join(metadata, 'dist', 'SHA256SUMS.txt'), 'utf8').trim();
              const entry = line.match(/^([0-9a-f]{64})\s+\*?([^\r\n]+)$/);
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (!entry || entry[2] !== item.name || entry[1] !== digest) {
                throw new Error('Checksum mismatch for ' + item.name);
              }
              if (item.name.endsWith('.exe') && bytes.subarray(0, 2).toString() !== 'MZ') {
                throw new Error('Invalid Windows installer header.');
              }
              if (item.name.endsWith('.dmg')
                  && (bytes.length < 512 || bytes.subarray(-512, -508).toString() !== 'koly')) {
                throw new Error('Invalid macOS disk image footer.');
              }
              if (item.name.endsWith('.zip')) {
                await exec.exec('unzip', ['-t', file], {silent: true});
                const listing = await exec.getExecOutput('unzip', ['-Z1', file], {silent: true});
                const required = item.key.startsWith('windows')
                  ? ['speedcrunch.exe', 'platforms/qwindows.dll', 'styles/qmodernwindowsstyle.dll',
                     'Licenses/README.txt']
                  : ['SpeedCrunch.app/Contents/MacOS/SpeedCrunch',
                     'SpeedCrunch.app/Contents/PlugIns/platforms/libqcocoa.dylib',
                     'SpeedCrunch.app/Contents/Resources/Licenses/README.txt'];
                const names = listing.stdout.split(/\r?\n/);
                for (const suffix of required) {
                  if (!names.some(name => name === suffix || name.endsWith('/' + suffix))) {
                    throw new Error('Missing ' + suffix + ' in ' + item.name);
                  }
                }
              }
              fs.copyFileSync(file, path.join('candidate', item.asset));
              checksums.push(digest + '  ' + item.asset);
            }
            fs.writeFileSync('candidate/SHA256SUMS.txt', checksums.join('\n') + '\n');
            selection.prepared_at = new Date().toISOString();
            fs.writeFileSync('candidate/build-info.json', JSON.stringify(selection, null, 2) + '\n');
            await core.summary.addHeading('Development build candidate')
              .addRaw('All four packages pass validation for commit ' + selection.sha + '.')
              .addTable([
                ['Workflow', 'Successful run'],
                ...selection.runs.map(run => [run.key, '<a href="' + run.url + '">' + run.id + '</a>'])
              ]).write();

      - name: Upload verified candidate
        uses: actions/upload-artifact@v7
        with:
          name: development-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 14

      - name: Explain validation-only run
        if: ${{ !inputs.publish }}
        run: echo 'Validation only. Check Publish development build in a manual run to publish these packages.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.publish }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@v8
        with:
          name: development-candidate
          path: candidate
          digest-mismatch: error

      - name: Publish complete development prerelease
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const info = JSON.parse(fs.readFileSync('candidate/build-info.json', 'utf8'));
            const expected = [
              'SpeedCrunch-development-windows-x64.exe',
              'SpeedCrunch-development-windows-x64.zip',
              'SpeedCrunch-development-macos-arm64.dmg',
              'SpeedCrunch-development-macos-arm64.zip'
            ];
            if (info.sha !== process.env.EXPECTED_SHA || !/^[0-9a-f]{40}$/.test(info.sha)) {
              throw new Error('Unexpected candidate source revision.');
            }
            const manifest = fs.readFileSync('candidate/SHA256SUMS.txt', 'utf8').trim().split('\n');
            if (manifest.length !== 4) throw new Error('Expected four package checksums.');
            for (const name of expected) {
              const bytes = fs.readFileSync(path.join('candidate', name));
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (!bytes.length || !manifest.includes(digest + '  ' + name)) {
                throw new Error('Invalid candidate package: ' + name);
              }
            }
            const assets = [...expected, 'SHA256SUMS.txt', 'build-info.json'];
            const local = fs.readdirSync('candidate').sort();
            if (JSON.stringify(local) !== JSON.stringify([...assets].sort())) {
              throw new Error('The candidate contains unexpected files.');
            }
            const repo = context.repo;
            const workflows = [
              'windows-debug', 'macos-debug', 'windows-installer',
              'windows-portable', 'macos-installer', 'macos-portable'
            ];
            if (info.runs.length !== workflows.length || workflows.some(key =>
                info.runs.filter(run => run.key === key).length !== 1)) {
              throw new Error('The candidate must identify all six CI runs.');
            }
            // A rerun can change a CI result while the candidate is downloading.
            for (const run of info.runs) {
              const current = (await github.rest.actions.getWorkflowRun({
                ...repo, run_id: run.id
              })).data;
              if (current.head_sha !== info.sha || current.head_branch !== 'main'
                  || current.status !== 'completed' || current.conclusion !== 'success') {
                throw new Error(run.key + ' no longer has a successful result for this commit.');
              }
            }
            const tag = 'development';
            const optional = async operation => {
              try { return (await operation()).data; }
              catch (error) { if (error.status === 404) return null; throw error; }
            };
            let release = await optional(() => github.rest.repos.getReleaseByTag({
              ...repo, tag
            }));
            if (release && (!release.prerelease || release.immutable)) {
              throw new Error('The development tag must belong to an editable prerelease.');
            }
            const ref = await optional(() => github.rest.git.getRef({
              ...repo, ref: 'tags/' + tag
            }));
            if (ref && !release && ref.object.sha !== info.sha) {
              throw new Error('The development tag already exists without a matching prerelease.');
            }
            const source = 'https://github.com/' + repo.owner + '/' + repo.repo;
            const body = [
              'Development packages for testing before the next official release.',
              '',
              'Source commit: [' + info.sha + '](' + source + '/commit/' + info.sha + ')',
              'Application version: ' + info.packages[0].version,
              'Prepared: ' + info.prepared_at,
              '',
              'All four packages come from this commit. Both Debug test workflows pass.',
              'SHA256SUMS.txt contains their checksums. build-info.json links to all six CI runs.',
              '',
              'The macOS packages have ad hoc signatures and are not notarized.',
              '',
              '[Matching SpeedCrunch sources](' + source + '/archive/' + info.sha + '.tar.gz)',
              '',
              ...info.runs.map(run => '- [' + run.key + '](' + run.url + ')')
            ].join('\n');
            // Hide the rolling prerelease while replacing assets so users cannot
            // download a mixture of packages from different commits.
            if (release) {
              release = (await github.rest.repos.updateRelease({
                ...repo, release_id: release.id, draft: true,
                prerelease: true, make_latest: 'false'
              })).data;
            }
            if (ref) {
              if (ref.object.sha !== info.sha) {
                await github.rest.git.updateRef({
                  ...repo, ref: 'tags/' + tag, sha: info.sha, force: true
                });
              }
            } else {
              await github.rest.git.createRef({...repo, ref: 'refs/tags/' + tag, sha: info.sha});
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: info.sha,
                name: 'Development builds', body, draft: true,
                prerelease: true, make_latest: 'false'
              })).data;
            }
            const previous = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100
            });
            for (const asset of previous) {
              await github.rest.repos.deleteReleaseAsset({...repo, asset_id: asset.id});
            }
            for (const name of assets) {
              const data = fs.readFileSync(path.join('candidate', name));
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}
              });
            }
            const uploaded = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100
            });
            if (uploaded.length !== assets.length || assets.some(name =>
                !uploaded.some(asset => asset.name === name && asset.state === 'uploaded' && asset.size > 0))) {
              throw new Error('The draft is incomplete. Leave it unpublished and rerun this workflow.');
            }
            const published = (await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, name: 'Development builds', body,
              draft: false, prerelease: true, make_latest: 'false'
            })).data;
            await core.summary.addHeading('Development build published')
              .addLink('Download all four packages', published.html_url).write();

