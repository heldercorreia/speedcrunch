name: Fedora Rawhide (Wayland, KWin)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: fedora:rawhide
      # kwin_wayland carries the cap_sys_nice file capability, which execve
      # refuses unless the container's bounding set includes it.
      options: --shm-size=1g --cap-add=SYS_NICE
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      DNF_PACKAGES: >-
        cmake gcc gcc-c++ make pkgconf-pkg-config libxcb-devel
        qt6-qtbase-devel qt6-qtbase-gui qt6-qttools-devel qt6-assistant
        qt6-linguist qt6-doctools qt6-qtwayland dejavu-sans-fonts
        dejavu-sans-mono-fonts dbus-daemon kwin-wayland mesa-dri-drivers
    steps:
      - name: Prepare container
        run: dnf install -y --setopt=install_weak_deps=False git-core tar zstd findutils

      - name: Check out source
        uses: actions/checkout@v4

      - name: Trust source directory
        # Checkout uses a temporary Git config that later shell steps do not share.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Record source revision
        run: git rev-parse HEAD > source-revision.txt

      - name: Resolve dependencies
        id: dnf-dependencies
        run: |
          read -r -a packages <<< "$DNF_PACKAGES"
          dnf --setopt=cachedir="$GITHUB_WORKSPACE/.cache/dnf" --refresh repoquery \
            --available --latest-limit=1 --queryformat '%{full_nevra}\n' \
            "${packages[@]}" > "$RUNNER_TEMP/dnf-packages.txt"
          dnf --setopt=cachedir="$GITHUB_WORKSPACE/.cache/dnf" repoquery \
            --available --latest-limit=1 --providers-of=requires --recursive \
            --queryformat '%{full_nevra}\n' \
            "${packages[@]}" >> "$RUNNER_TEMP/dnf-packages.txt"
          LC_ALL=C sort -u "$RUNNER_TEMP/dnf-packages.txt" > "$RUNNER_TEMP/dnf-packages-sorted.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/dnf-packages-sorted.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency downloads
        id: dnf-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/dnf/**/packages/*.rpm
          key: fedora-rawhide-${{ runner.arch }}-dnf-v1-${{ steps.dnf-dependencies.outputs.hash }}

      - name: Install dependencies
        run: |
          read -r -a packages <<< "$DNF_PACKAGES"
          dnf --setopt=cachedir="$GITHUB_WORKSPACE/.cache/dnf" \
            --setopt=keepcache=True --setopt=install_weak_deps=False \
            install -y "${packages[@]}"

      - name: Save dependency downloads
        if: steps.dnf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/dnf/**/packages/*.rpm
          key: ${{ steps.dnf-cache.outputs.cache-primary-key }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        id: build
        run: cmake --build build --parallel 4

      - name: Run non-UI tests
        run: >-
          ctest --test-dir build -C Release -LE '^ui$' --parallel 4
          --no-tests=error --output-on-failure --test-output-size-failed 0
          --output-log "$GITHUB_WORKSPACE/non-ui-tests.log"
          --output-junit "$GITHUB_WORKSPACE/test-results.xml"

      - name: Run UI tests (KWin)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          dbus-run-session -- sh -c '
            kwin_wayland --virtual --width 1280 --height 1024 --socket wayland-ci \
              --no-lockscreen --no-global-shortcuts >"$GITHUB_WORKSPACE/compositor.log" 2>&1 &
            compositor_pid=$!
            compositor_ready=false
            for attempt in $(seq 1 300); do
              if [ -S "$XDG_RUNTIME_DIR/wayland-ci" ]; then
                compositor_ready=true
                break
              fi
              if ! kill -0 "$compositor_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            if [ "$compositor_ready" != true ]; then
              echo "KWin did not become ready" >&2
              cat "$GITHUB_WORKSPACE/compositor.log" >&2
              exit 1
            fi
            WAYLAND_DISPLAY=wayland-ci QT_QPA_PLATFORM=wayland \
              ctest --test-dir build -C Release -L "^ui$" --parallel 1 \
              --timeout 180 --no-tests=error --output-on-failure --test-output-size-failed 0 \
              --output-log "$GITHUB_WORKSPACE/ui-tests.log" \
              --output-junit "$GITHUB_WORKSPACE/ui-test-results.xml"
            status=$?
            kill "$compositor_pid" 2>/dev/null
            exit "$status"
          '

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fedora-rawhide-test-logs
          path: |
            source-revision.txt
            build/Testing/Temporary/LastTest.log
            non-ui-tests.log
            test-results.xml
            ui-tests.log
            ui-test-results.xml
            compositor.log
          if-no-files-found: ignore
