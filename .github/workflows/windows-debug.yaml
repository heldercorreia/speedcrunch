name: Windows Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # This image includes VS 2022 for Qt's MSVC 2022 kit.
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      # CTest captures pipes, which Qt does not recognize as a Windows console.
      QT_FORCE_STDERR_LOGGING: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record source revision
        run: git rev-parse HEAD > source-revision.txt

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # aqtinstall 3.3.0 does not support Qt 6.12's repository layout.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: 'true'
          cache-key-prefix: windows-2022-qt-v1

      - name: Verify toolchain
        run: |
          if ($env:VisualStudioVersion -notlike '17.*') {
            throw "Expected Visual Studio 2022, got $env:VisualStudioVersion"
          }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') {
            throw "Expected an x64 toolchain, got $env:VSCMD_ARG_TGT_ARCH"
          }
          $qtVersion = & "$env:QT_ROOT_DIR/bin/qmake.exe" -query QT_VERSION
          if ($LASTEXITCODE -ne 0 -or $qtVersion.Trim() -ne '6.12.0') {
            throw "Expected Qt 6.12.0, got $qtVersion"
          }
          Write-Output "MSVC tools: $env:VCToolsVersion"
          Write-Output "Windows SDK: $env:WindowsSDKVersion"
          Write-Output "Qt: $qtVersion ($env:QT_ROOT_DIR)"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_VARIANT_DEV_DEBUG=ON
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        id: build
        run: cmake --build build --parallel 4

      - name: Run non-UI tests
        run: >-
          ctest --test-dir build -C Debug -LE '^ui$' --parallel 4
          --no-tests=error --output-on-failure --test-output-size-failed 0
          --output-log "$env:GITHUB_WORKSPACE/non-ui-tests.log"
          --output-junit "$env:GITHUB_WORKSPACE/test-results.xml"

      - name: Run native Windows UI tests
        timeout-minutes: 60
        env:
          QT_QPA_PLATFORM: windows
        # Native Debug suites can take several minutes on this runner.
        # CTest's timeout applies to a whole suite, including all data rows.
        run: |
          ctest --test-dir build -C Debug -L '^ui$' -LE '^startup-load$' --parallel 1 `
            --timeout 600 --no-tests=error --verbose `
            --test-output-size-failed 0 `
            --output-junit "$env:GITHUB_WORKSPACE/ui-test-results.xml" `
            2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/ui-tests.log"
          exit $LASTEXITCODE

      - name: Capture startup diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: windows
        run: |
          ctest --test-dir build -C Debug -L '^startup-load$' --parallel 1 `
            --no-tests=error --verbose --test-output-size-failed 0 `
            --output-junit "$env:GITHUB_WORKSPACE/startup-test-results.xml" `
            2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/startup-tests.log"
          exit $LASTEXITCODE

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-2022-debug-startup-diagnostics
          path: |
            source-revision.txt
            build/startup-diagnostics/
            startup-tests.log
            startup-test-results.xml
          if-no-files-found: ignore

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-2022-debug-test-logs
          path: |
            source-revision.txt
            build/Testing/Temporary/LastTest.log*
            non-ui-tests.log
            test-results.xml
            ui-tests.log
            ui-test-results.xml
          if-no-files-found: ignore
