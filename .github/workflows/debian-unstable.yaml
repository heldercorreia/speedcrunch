name: Debian Unstable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: debian:unstable
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      APT_PACKAGES: >-
        build-essential cmake fonts-dejavu-core libxcb-cursor0 libxcb1-dev
        libqt6sql6-sqlite openbox pkg-config qt6-base-dev qt6-documentation-tools
        qt6-l10n-tools qt6-qpa-plugins qt6-tools-dev qt6-tools-dev-tools
        x11-utils xauth xvfb
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git tar zstd

      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve dependencies
        id: apt-dependencies
        shell: bash
        run: |
          read -r -a packages <<< "$APT_PACKAGES"
          apt-get --print-uris install -y --no-install-recommends "${packages[@]}" > "$RUNNER_TEMP/apt-packages.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/apt-packages.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency downloads
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/apt/archives/*.deb
          key: debian-unstable-${{ runner.arch }}-apt-v1-${{ steps.apt-dependencies.outputs.hash }}

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p .cache/apt/archives/partial
          read -r -a packages <<< "$APT_PACKAGES"
          apt-get -o Dir::Cache::archives="$GITHUB_WORKSPACE/.cache/apt/archives" \
            -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends "${packages[@]}"

      - name: Save dependency downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/apt/archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run tests
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c '
            openbox >/dev/null 2>&1 &
            wm_ready=false
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id #"; then
                wm_ready=true
                break
              fi
              sleep 0.1
            done
            if [ "$wm_ready" != true ]; then
              echo "Openbox did not become ready" >&2
              exit 1
            fi
            ctest --test-dir build --output-on-failure --test-output-size-failed 0 \
              --output-junit "$GITHUB_WORKSPACE/test-results.xml"
          '

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debian-unstable-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            test-results.xml
          if-no-files-found: ignore
