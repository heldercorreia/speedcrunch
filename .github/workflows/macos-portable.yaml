name: macOS Portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record source revision
        run: git rev-parse HEAD > source-revision.txt

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: mac
          target: desktop
          arch: clang_64
          # aqtinstall 3.3.0 does not support Qt 6.12's repository layout.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: 'true'
          cache-key-prefix: macos-15-arm64-qt-packaging-v1
          modules: 'qtimageformats'
          source: 'true'
          src-archives: 'qtbase qttools qtsvg qtimageformats'

      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 15
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          test "$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)" = 6.12.0
          xcodebuild -version
          xcrun clang --version
          xcrun --sdk macosx --show-sdk-version
          "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_VARIANT_OFFICIAL_PORTABLE_RELEASE=ON
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4
          "-DCMAKE_C_COMPILER=$(xcrun --find clang)"
          "-DCMAKE_CXX_COMPILER=$(xcrun --find clang++)"
          "-DCMAKE_OBJCXX_COMPILER=$(xcrun --find clang++)"
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Stage and deploy application
        run: cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/stage"

      - name: Verify staged bundle
        run: |
          app=stage/SpeedCrunch.app
          for file in Contents/MacOS/SpeedCrunch \
            Contents/Frameworks/QtCore.framework/QtCore \
            Contents/Frameworks/QtWidgets.framework/QtWidgets \
            Contents/Frameworks/QtHelp.framework/QtHelp \
            Contents/PlugIns/platforms/libqcocoa.dylib \
            Contents/PlugIns/sqldrivers/libqsqlite.dylib \
            Contents/Resources/Licenses/README.txt \
            Contents/Resources/Licenses/SpeedCrunch-GPL-2.0.txt \
            Contents/Resources/Licenses/Qt/qtbase/qtbase-6.12.0.spdx \
            Contents/Resources/Licenses/Qt/qttools/qttools-6.12.0.spdx \
            Contents/Resources/Licenses/Qt/qtsvg/qtsvg-6.12.0.spdx \
            Contents/Resources/Licenses/Qt/qtimageformats/qtimageformats-6.12.0.spdx; do
            test -f "$app/$file" || { echo "Missing bundled file: $file" >&2; exit 1; }
          done
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/SpeedCrunch")" = arm64

      - name: Create portable ZIP
        # The install step has already bundled Qt and verified the signature.
        run: >-
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
          -D CPACK_INSTALL_CMAKE_PROJECTS=
          -D "CPACK_INSTALLED_DIRECTORIES=$GITHUB_WORKSPACE/stage;."

      - name: Verify package and record checksum
        run: |
          shopt -s nullglob
          packages=(dist/SpeedCrunch-*-macos-arm64.zip)
          test "${#packages[@]}" = 1
          revision=$(cat source-revision.txt)
          short_revision=${revision:0:8}
          package="${packages[0]/-macos-arm64/-dev-$short_revision-macos-arm64}"
          mv "${packages[0]}" "$package"
          test -s "$package"
          payload="$RUNNER_TEMP/speedcrunch-portable"
          ditto -x -k "$package" "$payload"
          count=$(find "$payload" -type d -name SpeedCrunch.app | wc -l | tr -d ' ')
          test "$count" = 1
          app=$(find "$payload" -type d -name SpeedCrunch.app)
          codesign --verify --deep --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/SpeedCrunch")" = arm64
          (cd dist && shasum -a 256 "$(basename "$package")") > dist/SHA256SUMS.txt

      - name: Upload portable ZIP
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/SpeedCrunch-*-macos-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload package metadata
        uses: actions/upload-artifact@v7
        with:
          name: macos-portable-metadata
          path: |
            source-revision.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Show download link
        env:
          PACKAGE_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "[macOS Portable download]($PACKAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $(cat source-revision.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packaging logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-15-portable-logs
          path: |
            source-revision.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            dist/_CPack_Packages/**/*.log
          if-no-files-found: ignore

