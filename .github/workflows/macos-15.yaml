name: macOS 15

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: mac
          target: desktop
          arch: clang_64
          cache: 'true'
          cache-key-prefix: macos-15-arm64-qt-v1

      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 15
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          test "$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)" = 6.12.0
          xcodebuild -version
          xcrun clang --version
          xcrun --sdk macosx --show-sdk-version
          "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.4
          "-DCMAKE_C_COMPILER=$(xcrun --find clang)"
          "-DCMAKE_CXX_COMPILER=$(xcrun --find clang++)"
          "-DCMAKE_OBJCXX_COMPILER=$(xcrun --find clang++)"
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel 4

      # Keep compiling UI tests, but do not run them on this runner yet.
      - name: Run non-UI tests
        run: >-
          ctest --test-dir build -C Release -LE '^ui$'
          --no-tests=error --output-on-failure --test-output-size-failed 0
          --output-junit "$GITHUB_WORKSPACE/test-results.xml"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-15-test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            test-results.xml
          if-no-files-found: ignore
