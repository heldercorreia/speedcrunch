name: Ubuntu 24.04 Debug

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      APT_PACKAGES: >-
        libxcb1-dev openbox pkg-config qt6-base-dev qt6-l10n-tools
        qt6-tools-dev qt6-tools-dev-tools x11-utils xauth xvfb
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record source revision
        run: git rev-parse HEAD > source-revision.txt

      - name: Resolve dependencies
        id: apt-dependencies
        shell: bash
        run: |
          sudo apt-get update
          read -r -a packages <<< "$APT_PACKAGES"
          sudo apt-get --print-uris install -y "${packages[@]}" > "$RUNNER_TEMP/apt-packages.txt"
          echo "hash=$(sha256sum "$RUNNER_TEMP/apt-packages.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency downloads
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/apt/archives/*.deb
          key: ubuntu-24.04-${{ runner.arch }}-apt-v1-${{ steps.apt-dependencies.outputs.hash }}

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p .cache/apt/archives/partial
          read -r -a packages <<< "$APT_PACKAGES"
          sudo apt-get -o Dir::Cache::archives="$GITHUB_WORKSPACE/.cache/apt/archives" \
            -o APT::Keep-Downloaded-Packages=true install -y "${packages[@]}"

      - name: Save dependency downloads
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/apt/archives/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Configure
        run: cmake -S . -B build -DBUILD_VARIANT_DEV_DEBUG=ON

      - name: Build
        id: build
        run: cmake --build build --parallel 4

      - name: Run non-UI tests
        run: >-
          ctest --test-dir build -C Debug -LE '^ui$' --parallel 4
          --no-tests=error --output-on-failure --test-output-size-failed 0
          --output-log "$GITHUB_WORKSPACE/non-ui-tests.log"
          --output-junit "$GITHUB_WORKSPACE/test-results.xml"

      - name: Run UI tests
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c '
            openbox >/dev/null 2>&1 &
            wm_ready=false
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id #"; then
                wm_ready=true
                break
              fi
              sleep 0.1
            done
            if [ "$wm_ready" != true ]; then
              echo "Openbox did not become ready" >&2
              exit 1
            fi
            ctest --test-dir build -C Debug -L "^ui$" -LE "^startup-load$" --parallel 1 \
              --timeout 180 --no-tests=error --output-on-failure --test-output-size-failed 0 \
              --output-log "$GITHUB_WORKSPACE/ui-tests.log" \
              --output-junit "$GITHUB_WORKSPACE/ui-test-results.xml"
          '

      - name: Capture Classic and Modern startup diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c '
            openbox >/dev/null 2>&1 &
            wm_ready=false
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id #"; then
                wm_ready=true
                break
              fi
              sleep 0.1
            done
            if [ "$wm_ready" != true ]; then
              echo "Openbox did not become ready" >&2
              exit 1
            fi
            ctest --test-dir build -C Debug -L "^startup-load$" --parallel 1 \
              --no-tests=error --verbose --test-output-size-failed 0 \
              --output-log "$GITHUB_WORKSPACE/startup-tests.log" \
              --output-junit "$GITHUB_WORKSPACE/startup-test-results.xml"
          '

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-24.04-debug-startup-diagnostics
          path: |
            source-revision.txt
            build/startup-diagnostics/
            startup-tests.log
            startup-test-results.xml
          if-no-files-found: ignore

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-24.04-debug-test-logs
          path: |
            source-revision.txt
            build/Testing/Temporary/LastTest.log
            non-ui-tests.log
            test-results.xml
            ui-tests.log
            ui-test-results.xml
          if-no-files-found: ignore
