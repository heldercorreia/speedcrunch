name: Windows Portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-package:
    # This image includes VS 2022 for Qt's MSVC 2022 kit.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record source revision
        run: git rev-parse HEAD > source-revision.txt

      - name: Set up MSVC 2022 x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # aqtinstall 3.3.0 does not support Qt 6.12's repository layout.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          cache: 'true'
          cache-key-prefix: windows-2022-qt-packaging-v1
          source: 'true'
          src-archives: 'qtbase qttools qtsvg qtimageformats'

      - name: Verify toolchain
        run: |
          if ($env:VisualStudioVersion -notlike '17.*') {
            throw "Expected Visual Studio 2022, got $env:VisualStudioVersion"
          }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') {
            throw "Expected an x64 toolchain, got $env:VSCMD_ARG_TGT_ARCH"
          }
          $qtVersion = & "$env:QT_ROOT_DIR/bin/qmake.exe" -query QT_VERSION
          if ($LASTEXITCODE -ne 0 -or $qtVersion.Trim() -ne '6.12.0') {
            throw "Expected Qt 6.12.0, got $qtVersion"
          }
          Write-Output "MSVC tools: $env:VCToolsVersion"
          Write-Output "Windows SDK: $env:WindowsSDKVersion"
          Write-Output "Qt: $qtVersion ($env:QT_ROOT_DIR)"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_VARIANT_OFFICIAL_PORTABLE_RELEASE=ON
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Stage application
        run: cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/stage"

      - name: Deploy Qt dependencies
        run: |
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-compiler-runtime stage/speedcrunch.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment fails' }

      - name: Verify staged files
        run: |
          $required = @(
            'speedcrunch.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll',
            'Qt6Help.dll', 'Qt6Network.dll', 'Qt6Sql.dll',
            'platforms/qwindows.dll', 'styles/qmodernwindowsstyle.dll',
            'sqldrivers/qsqlite.dll', 'tls/qschannelbackend.dll',
            'msvcp140.dll', 'vcruntime140.dll',
            'Licenses/README.txt', 'Licenses/SpeedCrunch-GPL-2.0.txt',
            'Licenses/Qt/qtbase/qtbase-6.12.0.spdx',
            'Licenses/Qt/qttools/qttools-6.12.0.spdx'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -Path "stage/$file" -PathType Leaf)) {
              throw "Missing packaged dependency or notice: $file"
            }
          }

      - name: Create portable ZIP
        # Package the deployed folder so CPack keeps the extra Qt plugins.
        run: >-
          cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
          -D "CPACK_INSTALL_CMAKE_PROJECTS="
          -D "CPACK_INSTALLED_DIRECTORIES=$env:GITHUB_WORKSPACE/stage;."

      - name: Record package checksum
        run: |
          $packages = @(Get-ChildItem -Path dist -Filter 'SpeedCrunch-*-windows-x64.zip' -File)
          if ($packages.Count -ne 1) {
            throw "Expected one ZIP package, found $($packages.Count)"
          }
          $revision = (Get-Content source-revision.txt -Raw).Trim()
          $shortRevision = $revision.Substring(0, 8)
          $name = $packages[0].Name -replace '-windows-x64', "-dev-$shortRevision-windows-x64"
          Rename-Item -Path $packages[0].FullName -NewName $name
          $package = Get-Item "dist/$name"
          if ($package.Length -eq 0) { throw 'Package is empty' }
          $hash = (Get-FileHash -Path $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($package.Name)" | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload portable ZIP
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/SpeedCrunch-*-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload package metadata
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-metadata
          path: |
            source-revision.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Show download link
        env:
          PACKAGE_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          "[Windows Portable download]($env:PACKAGE_URL)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Source commit: $(Get-Content source-revision.txt)" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload packaging logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-logs
          path: |
            source-revision.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            dist/_CPack_Packages/**/*.log
          if-no-files-found: ignore

