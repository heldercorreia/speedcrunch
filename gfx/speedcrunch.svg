<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>
    <!-- Duskfox shell. -->
    <linearGradient id="shell" gradientUnits="userSpaceOnUse"
                    x1="72" y1="52" x2="448" y2="472">
      <stop offset="0%" stop-color="#191827"/>
      <stop offset="48%" stop-color="#232136"/>
      <stop offset="100%" stop-color="#393552"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="23%" cy="15%" r="82%">
      <stop offset="0%" stop-color="#c4a7e7" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#aaa9da" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#232136" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseGlow" cx="90%" cy="90%" r="62%">
      <stop offset="0%" stop-color="#ea9a97" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#232136" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shellEdge" gradientUnits="userSpaceOnUse"
                    x1="70" y1="52" x2="444" y2="472">
      <stop offset="0%" stop-color="#e0def4" stop-opacity="0.48"/>
      <stop offset="52%" stop-color="#c4a7e7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9ccfd8" stop-opacity="0.30"/>
    </linearGradient>

    <!-- A tapered, variable-width S shaped like a gymnast's ribbon. -->
    <path id="ribbonShape"
          d="M414 166
             C366 108 286 88 210 108
             C138 127 96 173 108 220
             C120 268 179 282 249 290
             C318 298 365 313 365 343
             C365 376 321 398 268 399
             C206 399 153 375 119 340
             L72 385
             C125 428 197 445 270 443
             C352 442 414 402 414 338
             C414 270 345 247 269 238
             C211 231 156 221 155 195
             C154 169 190 148 229 140
             C284 129 350 142 402 173
             Z"/>

    <!-- Color travels from the leading tip to the trailing tail. -->
    <linearGradient id="ribbonBase" gradientUnits="userSpaceOnUse"
                    x1="408" y1="140" x2="86" y2="392">
      <stop offset="0%" stop-color="#ff829d"/>
      <stop offset="18%" stop-color="#d796ff"/>
      <stop offset="39%" stop-color="#76dce9"/>
      <stop offset="59%" stop-color="#32b7da"/>
      <stop offset="79%" stop-color="#9bd66f"/>
      <stop offset="100%" stop-color="#ffca5f"/>
    </linearGradient>

    <linearGradient id="ribbonEdge" gradientUnits="userSpaceOnUse"
                    x1="118" y1="102" x2="382" y2="438">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="44%" stop-color="#e0def4" stop-opacity="0.18"/>
      <stop offset="72%" stop-color="#569fba" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ea9a97" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Cooler reverse side becomes visible as the ribbon turns through the waist. -->
    <linearGradient id="foldFace" gradientUnits="userSpaceOnUse"
                    x1="148" y1="205" x2="382" y2="292">
      <stop offset="0%" stop-color="#667ee8"/>
      <stop offset="40%" stop-color="#69d5e7"/>
      <stop offset="73%" stop-color="#cf91ff"/>
      <stop offset="100%" stop-color="#ff7898"/>
    </linearGradient>

    <linearGradient id="foldLight" gradientUnits="userSpaceOnUse"
                    x1="154" y1="198" x2="372" y2="286">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="46%" stop-color="#e0def4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="meshEdge" gradientUnits="userSpaceOnUse"
                    x1="104" y1="112" x2="404" y2="424">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.68"/>
      <stop offset="46%" stop-color="#b7f4ff" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#191827" stop-opacity="0.58"/>
    </linearGradient>

    <!-- A compact triangular lattice. The alternating planes avoid a flat grid. -->
    <pattern id="triangleField"
             width="96" height="84"
             patternUnits="userSpaceOnUse"
             patternTransform="rotate(-7 256 256)">
      <path d="M0 0 L48 0 L24 42 Z"
            fill="#ffffff" fill-opacity="0.14"/>
      <path d="M48 0 L72 42 L24 42 Z"
            fill="#d08cff" fill-opacity="0.16"/>
      <path d="M48 0 L96 0 L72 42 Z"
            fill="#ff718f" fill-opacity="0.14"/>
      <path d="M0 0 L24 42 L0 84 Z"
            fill="#11101d" fill-opacity="0.16"/>
      <path d="M0 84 L24 42 L48 84 Z"
            fill="#6ce5f2" fill-opacity="0.15"/>
      <path d="M24 42 L72 42 L48 84 Z"
            fill="#ffffff" fill-opacity="0.09"/>
      <path d="M72 42 L96 84 L48 84 Z"
            fill="#25b9e0" fill-opacity="0.15"/>
      <path d="M96 0 L96 84 L72 42 Z"
            fill="#191827" fill-opacity="0.13"/>

      <path d="M0 0 H96 M0 84 H96
               M0 0 L24 42 L48 0
               M24 42 L48 84 L72 42 L96 0
               M0 84 L24 42 L72 42 L96 84"
            fill="none"
            stroke="url(#meshEdge)"
            stroke-width="1.35"
            stroke-linejoin="round"/>
    </pattern>

    <filter id="ribbonShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="ribbonClip">
      <use href="#ribbonShape"/>
    </clipPath>

    <clipPath id="shellClip">
      <rect x="32" y="32" width="448" height="448" rx="112"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="112"
        fill="url(#shell)"/>

  <g clip-path="url(#shellClip)">
    <rect x="32" y="32" width="448" height="448" rx="112"
          fill="url(#violetGlow)"/>
    <rect x="32" y="32" width="448" height="448" rx="112"
          fill="url(#roseGlow)"/>

    <path d="M-12 414 C126 306 272 216 526 126"
          fill="none"
          stroke="#9ccfd8"
          stroke-width="72"
          stroke-linecap="round"
          stroke-opacity="0.035"/>
    <circle cx="446" cy="448" r="170"
            fill="#569fba" fill-opacity="0.055"/>
  </g>

  <rect x="39" y="39" width="434" height="434" rx="105"
        fill="none"
        stroke="url(#shellEdge)"
        stroke-width="2"/>

  <g clip-path="url(#shellClip)">
    <!-- Scale around the ribbon bounds while keeping their center at (256, 256). -->
    <g transform="matrix(0.92 0 0 0.92 32.44 5.932343)">
      <!-- The displaced shadow keeps the fabric visibly separate from the shell. -->
      <use href="#ribbonShape"
           fill="#11101d"
           fill-opacity="0.50"
           transform="translate(0 12)"
           filter="url(#ribbonShadow)"/>

      <use href="#ribbonShape"
           fill="url(#ribbonBase)"
           stroke="url(#ribbonEdge)"
           stroke-width="3"/>

      <g clip-path="url(#ribbonClip)">
        <!-- Broad planes make the mesh describe the ribbon's large turns. -->
        <polygon points="95,209 153,137 224,103 185,167 111,241"
                 fill="#f4f0ff" fill-opacity="0.17"/>
        <polygon points="224,103 302,101 258,153 185,167"
                 fill="#70e1ed" fill-opacity="0.17"/>
        <polygon points="302,101 414,166 348,146 258,153"
                 fill="#ff6f91" fill-opacity="0.20"/>
        <polygon points="111,241 185,167 155,211 216,277"
                 fill="#11101d" fill-opacity="0.20"/>
        <polygon points="155,211 268,238 216,277"
                 fill="#596ee2" fill-opacity="0.22"/>
        <polygon points="216,277 268,238 343,257 300,300"
                 fill="#f2efff" fill-opacity="0.14"/>
        <polygon points="300,300 343,257 414,321 365,343"
                 fill="#cd88ff" fill-opacity="0.18"/>
        <polygon points="365,343 414,321 395,386 332,382"
                 fill="#11101d" fill-opacity="0.23"/>
        <polygon points="332,382 395,386 270,443 268,399"
                 fill="#60deec" fill-opacity="0.20"/>
        <polygon points="119,340 268,399 270,443 176,423"
                 fill="#8fde67" fill-opacity="0.21"/>
        <polygon points="72,385 119,340 176,423"
                 fill="#ffbd4a" fill-opacity="0.23"/>

        <!-- The repeating cells create a true triangle mesh at every scale. -->
        <rect x="60" y="88" width="368" height="368"
              fill="url(#triangleField)"/>

        <!-- The waist flips forward, exposing the cooler reverse face. -->
        <path d="M154 196
                 C161 225 211 236 269 243
                 C323 250 365 265 391 294
                 C365 274 326 264 270 257
                 C210 250 166 238 151 213
                 Z"
              fill="#11101d"
              fill-opacity="0.20"
              transform="translate(0 7)"/>

        <path d="M154 196
                 C161 225 211 236 269 243
                 C323 250 365 265 391 294
                 C365 274 326 264 270 257
                 C210 250 166 238 151 213
                 Z"
              fill="url(#foldFace)"/>

        <path d="M156 199
                 C166 224 214 233 270 240
                 C318 246 356 258 382 282"
              fill="none"
              stroke="url(#foldLight)"
              stroke-width="4"
              stroke-linecap="round"/>
      </g>

      <!-- Restore a crisp silhouette after the clipped facets meet the edge. -->
      <use href="#ribbonShape"
           fill="none"
           stroke="url(#ribbonEdge)"
           stroke-width="3"/>
    </g>
  </g>
</svg>
